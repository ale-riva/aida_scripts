# ==============================================================================
# Sensor settings: Serravalle/Niguarda (3 cameras, 1 LiDAR)
# This file defines sensor topics, frame IDs, and the calibration reference frame.
# It is loaded automatically by the pipeline when config.yaml references it.
# ==============================================================================

# All sensor-to-sensor transforms are expressed relative to this frame.
reference_frame: "ouster_sensor_center"

# LiDAR keys name the output folders and CSV columns; the first is the timestamp reference.
lidars:
  lidar_center:
    topic: "/ouster_sensor_center/points"
    frame_id: "ouster_sensor_center"

# Camera order defines the column order in the output CSV (camera_0 .. camera_6).
cameras:
  camera_0:
    topic: "/lucid_vision/lucid_cam_front_center/image_rect/compressed"
    frame_id: "lucid_cam_front_center"
    name: "camera_front_center"
    compressed: true
    undistorted: true
    is_optical: true   # if frame is in optical convention (x right, y down, z forward)
  camera_1:
    topic: "/lucid_vision/lucid_cam_front_left/image_rect/compressed"
    frame_id: "lucid_cam_front_left"
    name: "camera_front_left"
    compressed: true
    undistorted: true
    is_optical: true   # if frame is in optical convention (x right, y down, z forward)

  camera_2:
    topic: "/lucid_vision/lucid_cam_front_right/image_rect/compressed"
    frame_id: "lucid_cam_front_right"
    name: "camera_front_right"
    compressed: true
    undistorted: true
    is_optical: true   # if frame is in optical convention (x right, y down, z forward)

  camera_3:
    topic: "/lucid_vision/lucid_cam_rear_center/image_rect/compressed"
    frame_id: "lucid_cam_rear_center"
    name: "camera_rear_center"
    compressed: true
    undistorted: true
    is_optical: true   # if frame is in optical convention (x right, y down, z forward)


# Topic and frame pair used to extract ego pose for each matched group.
ego_pose:
  topic: "/tf"
  parent_frame: "ekf"
  child_frame: "base_link"