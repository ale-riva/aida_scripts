# ==============================================================================
# Sensor settings: EVA  (7 cameras, 3 LiDARs)
# This file defines sensor topics, frame IDs, and the calibration reference frame.
# It is loaded automatically by the pipeline when config.yaml references it.
# ==============================================================================

# All sensor-to-sensor transforms are expressed relative to this frame.
reference_frame: "center_of_gravity"

# LiDAR order matters: lidar_front is the reference used for timestamp matching.
lidars:
  lidar_front:
    topic: "/sensor/lidar_front/points"
    frame_id: "lidar_front"
  lidar_left:
    topic: "/sensor/lidar_left/points"
    frame_id: "lidar_left"
  lidar_right:
    topic: "/sensor/lidar_right/points"
    frame_id: "lidar_right"

# Camera order defines the column order in the output CSV (camera_0 .. camera_6).
cameras:
  camera_0:
    topic: "/sensor/camera/camera_cl/image/compressed"
    frame_id: "camera_cl"
    name: "camera_cl"
    compressed: true
  camera_1:
    topic: "/sensor/camera/camera_fl/image/compressed"
    frame_id: "camera_fl"
    name: "camera_fl"
    compressed: true
  camera_2:
    topic: "/sensor/camera/camera_fr/image/compressed"
    frame_id: "camera_fr"
    name: "camera_fr"
    compressed: true
  camera_3:
    topic: "/sensor/camera/camera_cr/image/compressed"
    frame_id: "camera_cr"
    name: "camera_cr"
    compressed: true
  camera_4:
    topic: "/sensor/camera/camera_rr/image/compressed"
    frame_id: "camera_rr"
    name: "camera_rr"
    compressed: true
  camera_5:
    topic: "/sensor/camera/camera_r/image/compressed"
    frame_id: "camera_r"
    name: "camera_r"
    compressed: true
  camera_6:
    topic: "/sensor/camera/camera_rl/image/compressed"
    frame_id: "camera_rl"
    name: "camera_rl"
    compressed: true

# Topic and frame pair used to extract ego pose for each matched group.
ego_pose:
  topic: "/tf"
  parent_frame: "map"
  child_frame: "center_of_gravity"