# Configuration for ir_inspection/automatic/inspect_dataset.py's balancing step.

balancing:

  random_seed: 42

  # Shared with the "distance distribution" plot, and used by distance_bin_cap below.
  # The last edge is always open-ended (e.g. "80+"), never a hard ceiling.
  distance_bin_edges_m: [0, 20, 40, 60, 80, 100]

  rules:
    # Caps the total number of annotations kept within each distance bin.
    - type: distance_bin_cap
      max_annotations_per_bin: null      # int, or null to disable this rule

    # Caps the total number of annotations kept within each BEV quadrant
    # Quadrant labels: top-left, top-right, bottom-left, bottom-right.
    - type: quadrant_cap
      # max_annotations_per_quadrant:
      #   top-left: 50
      #   top-right: 50
      #   bottom-left: 50
      #   bottom-right: 50

      # Example for all quadrants caps:
      max_annotations_per_quadrant: null # int, {quadrant: int|null}, or null to disable this rule

    # Caps the fraction of kept frames that contain zero annotations.
    - type: empty_frame_ratio
      max_ratio: 0.7                    # float in (0, 1], or null to disable this rule

    # Drops frames whose annotations are all "sparse"
    - type: min_points_in_bbox
      min_points: 1                   # int, or null to disable this rule